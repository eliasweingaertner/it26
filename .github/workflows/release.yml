name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

# A push to master and a tag push can arrive together; let each ref build
# independently but cancel a stale continuous build superseded by a newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------------
  # Decide what we are building: a numeric version for the installer, a
  # human label for the filenames, and whether this is a prerelease.
  #   tag v1.2.3  -> version 1.2.3, label v1.2.3, real release
  #   master push -> version 0.0.0, label continuous-<sha>, prerelease
  # ------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.m.outputs.version }}
      label: ${{ steps.m.outputs.label }}
      prerelease: ${{ steps.m.outputs.prerelease }}
    steps:
      - id: m
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "label=${tag}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "label=continuous-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------------
  # Windows: NSIS installer + portable ZIP (both self-contained).
  # ------------------------------------------------------------------------
  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        timeout-minutes: 10
        run: choco install nsis -y --no-progress

      - name: Configure
        run: cmake -B build -DITTRACK_VERSION=${{ needs.meta.outputs.version }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Determinism regression
        shell: bash
        run: |
          bin=$(find build -type f -name test_pattern.exe | head -1)
          fail=0
          for m in beyond_network itdemo quests_end synthscape_filters; do
            echo "--- $m"; "$bin" "testdata/$m.it" || fail=1
          done
          exit $fail

      - name: Package (CPack)
        working-directory: build
        run: cpack -C Release

      - name: Rename artifacts
        shell: bash
        env:
          LABEL: ${{ needs.meta.outputs.label }}
        run: |
          mkdir -p dist
          mv build/ittrack-*.exe "dist/ittrack-${LABEL}-windows-x64-setup.exe"
          mv build/ittrack-*.zip "dist/ittrack-${LABEL}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # ------------------------------------------------------------------------
  # Linux: an AppImage of the editor (bundles SDL2 for the authentic pixel
  # window) plus the bare, dependency-free itplay binary.
  # ------------------------------------------------------------------------
  linux:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LABEL: ${{ needs.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + packaging deps
        timeout-minutes: 12
        run: |
          set +e
          pkgs="libsdl2-dev imagemagick file wget"
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -o Acquire::Retries=3 || { sleep 15; continue; }
            timeout 300 sudo apt-get install -y -o Acquire::Retries=3 $pkgs && exit 0
            echo "apt attempt $i stalled or failed; retrying" >&2
            sleep 15
          done
          exit 1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DITTRACK_VERSION=${{ needs.meta.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Determinism regression
        run: |
          fail=0
          for m in beyond_network itdemo quests_end synthscape_filters; do
            echo "--- $m"; ./build/test_pattern "testdata/$m.it" || fail=1
          done
          exit $fail

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/ited AppDir/usr/bin/ited
          cat > AppDir/usr/share/applications/ited.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ited
          Comment=Impulse Tracker editor
          Exec=ited
          Icon=ited
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF
          # A plain IT-blue "IT" tile as the icon (no binary asset in-repo).
          convert -size 256x256 canvas:'#0000AA' -gravity center \
                  -pointsize 120 -fill '#FFFFFF' -font DejaVu-Sans-Bold \
                  -annotate 0 'IT' \
                  AppDir/usr/share/icons/hicolor/256x256/apps/ited.png

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          wget -q --tries=3 --timeout=60 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/ited \
            --desktop-file AppDir/usr/share/applications/ited.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/ited.png \
            --output appimage
          mkdir -p dist
          mv ited*.AppImage "dist/ited-${LABEL}-x86_64.AppImage"
          cp build/itplay "dist/itplay-${LABEL}-linux-x86_64"
          chmod +x "dist/itplay-${LABEL}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ------------------------------------------------------------------------
  # macOS: a drag-to-install DMG holding ited.app -- the authentic SDL2
  # pixel window, with SDL2 bundled *inside* the app so it runs on a Mac
  # that has no Homebrew -- plus the bare, dependency-free itplay CLI. The
  # runner is Apple Silicon (arm64); the arch goes in the filename.
  # ------------------------------------------------------------------------
  macos:
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + packaging deps
        timeout-minutes: 15
        run: brew install sdl2 dylibbundler imagemagick

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DITTRACK_VERSION=${VERSION}

      - name: Build
        run: cmake --build build --parallel

      - name: Determinism regression
        run: |
          fail=0
          for m in beyond_network itdemo quests_end synthscape_filters; do
            echo "--- $m"; ./build/test_pattern "testdata/$m.it" || fail=1
          done
          exit $fail

      - name: Assemble ited.app
        run: |
          APP="ited.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/ited "$APP/Contents/MacOS/ited"

          # A plain IT-blue "IT" tile as the icon (mirrors the Linux AppImage;
          # no binary asset in-repo). sips fans it out to the .icns sizes.
          magick -size 512x512 canvas:'#0000AA' -gravity center \
                 -fill '#FFFFFF' -font '/System/Library/Fonts/Helvetica.ttc' \
                 -pointsize 240 -annotate 0 'IT' /tmp/icon.png
          mkdir -p ited.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s          /tmp/icon.png --out "ited.iconset/icon_${s}x${s}.png"    >/dev/null
            sips -z $((s*2)) $((s*2)) /tmp/icon.png --out "ited.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns ited.iconset -o "$APP/Contents/Resources/ited.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>ited</string>
            <key>CFBundleDisplayName</key><string>ited</string>
            <key>CFBundleExecutable</key><string>ited</string>
            <key>CFBundleIdentifier</key><string>org.ittrack.ited</string>
            <key>CFBundleIconFile</key><string>ited</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict>
          </plist>
          EOF

          # Copy SDL2 (and any other non-system dylib) into the app and
          # rewrite the load paths to @executable_path/../libs so it runs
          # without Homebrew. dylibbundler ad-hoc re-signs what it touches;
          # sign the whole bundle too so it launches on Apple Silicon.
          dylibbundler -od -b -cd \
            -x "$APP/Contents/MacOS/ited" \
            -d "$APP/Contents/libs" \
            -p '@executable_path/../libs'
          codesign --force --deep --sign - "$APP" || true

      - name: Build DMG
        run: |
          arch=$(uname -m)
          mkdir -p dmgroot
          cp -R ited.app dmgroot/
          cp build/itplay dmgroot/itplay
          chmod +x dmgroot/itplay
          ln -s /Applications dmgroot/Applications
          mkdir -p dist
          hdiutil create -volname "ittrack ${LABEL}" \
            -srcfolder dmgroot -ov -format UDZO \
            "dist/ittrack-${LABEL}-macos-${arch}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # ------------------------------------------------------------------------
  # Publish. Tag pushes get a normal release; master pushes refresh a single
  # rolling "continuous" prerelease so the releases page stays clean.
  # ------------------------------------------------------------------------
  publish:
    needs: [meta, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          LABEL: ${{ needs.meta.outputs.label }}
        run: |
          R="$GITHUB_REPOSITORY"
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release delete continuous -R "$R" --yes --cleanup-tag || true
            gh release create continuous -R "$R" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Continuous build (${LABEL})" \
              --notes "Rolling build of the latest \`master\` (${GITHUB_SHA})." \
              dist/*
          else
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" -R "$R" \
              --title "$tag" \
              --generate-notes \
              dist/*
          fi
